# Runs the TARANG test suite on every push and pull request.
# No job spends FlexCredits except "cloud-smoke", which runs only when started by
# hand (Actions -> tests -> Run workflow -> tick "run_cloud") and needs the
# TIDY3D_API_KEY repository secret.
name: tests

on:
  push:
    branches: [main]               # after a merge
  pull_request:                    # every push to a branch with an open PR (drafts included)
  workflow_dispatch:
    inputs:
      run_cloud:
        description: "Also run the real-cloud smoke test (about 0.03 FlexCredits; needs the TIDY3D_API_KEY secret)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:                       # a newer push cancels the older run on the same branch
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    env:
      MPLBACKEND: Agg
      TARANG_CACHE_DIR: ${{ github.workspace }}/.tarang-cache    # fitted-material cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Cache fitted materials
        uses: actions/cache@v4
        with:
          path: .tarang-cache
          key: media-${{ runner.os }}-${{ hashFiles('media/media.json', 'media/data/**') }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Show versions
        run: python -c "import sys, tidy3d, numpy, dynesty; print(sys.version); print('tidy3d', tidy3d.__version__, '| numpy', numpy.__version__, '| dynesty', dynesty.__version__)"

      - name: Run tests
        run: python -m pytest -q -rs --durations=10 --cov=. --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  multinest:
    # The MultiNest backend needs the native library; conda-forge provides it on Linux.
    name: ubuntu / MultiNest backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: tarang-multinest
          create-args: >-
            python=3.11
            multinest
            pymultinest
            pip
          init-shell: bash

      - name: Install
        run: python -m pip install -r requirements-test.txt

      - name: Nested-sampling tests (MultiNest test must run, not skip)
        run: |
          python -c "from utilities.nested_backends import available_backends as a; b = a(); print(b); assert 'multinest' in b"
          python -m pytest -q -rs tests/test_nested_backends.py

  cloud-smoke:
    name: real Tidy3D cloud smoke test (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_cloud
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      SIMCLOUD_APIKEY: ${{ secrets.TIDY3D_API_KEY }}    # the variable Tidy3D reads
      TARANG_MAX_COST: "0.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install
        run: python -m pip install -r requirements-test.txt
      - name: Cloud smoke test
        run: python -m pytest -v -rs --run-cloud tests/test_cloud_smoke.py
