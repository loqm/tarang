[pytest]
# Run from the repository root:  python -m pytest
#   quick check, skipping mode solves and material fits:  python -m pytest -m "not slow"
#   include the real-cloud smoke test (spends FlexCredits):  python -m pytest --run-cloud
testpaths = tests

markers =
    slow: needs a local mode solve or a fresh material fit (tens of seconds); deselect with -m "not slow"
    real_figures: write figures with the configured formats and dpi (others: 72 dpi PNG)
    real_modes: use Tidy3D's local mode solver in tarang.design (others get a fast synthetic one)
    cloud: submits a real Tidy3D cloud job and spends FlexCredits; runs only with --run-cloud

filterwarnings =
    # TARANG must never call its own deprecated names (tests that check the
    # aliases use pytest.warns, which overrides this).
    error:.*TARANG v0\.2\.0:DeprecationWarning
    # Third-party noise: getdist uses a matplotlib attribute deprecated in 3.11.
    ignore::DeprecationWarning:getdist.*
    ignore:The format attribute was deprecated:DeprecationWarning
