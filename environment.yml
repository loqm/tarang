# TARANG conda environment (Windows, Linux, macOS).
#
# From the repository folder:
#     conda env create -f environment.yml
#     conda activate tarang
#
# This installs TARANG itself in editable mode (`pip install -e .`), so changes
# to the code take effect without reinstalling. The dependency list lives in
# pyproject.toml; this file only adds Python and the optional MultiNest library.
#
# Update an existing environment after pulling new code:
#     conda env update -f environment.yml
name: tarang
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # Optional MultiNest backend for nested sampling (Linux and macOS only; dynesty,
  # installed by default, works everywhere). Uncomment both lines to use it:
  # - multinest
  # - pymultinest
  - pip:
      - -e .[plots,notebooks,test]
