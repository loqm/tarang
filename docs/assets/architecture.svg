<text x="58" y="370" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#13233a" text-anchor="start">Wrapper convention: every builder returns a physics object that holds the raw simulation on .sim.</text>
<text x="58" y="388" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6d7a89" text-anchor="start">RidgeWaveguide also forwards unknown attributes to it, so wg.plot(z=0) reaches Tidy3D directly.</text>
